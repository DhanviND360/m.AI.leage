[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mileage"
version = "0.1.0"
description = "m.AI.leage: Lightweight, local-first Python CLI for local AI agents, workspace intelligence, and telemetry"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "m.AI.leage Team" }
]
keywords = ["ai", "cli", "ollama", "local-first", "typer", "rich", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.10",
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.10",
]

[project.scripts]
mileage = "mileage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
